<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>main</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

  </head>
  <body class="bg-dark text-light">
    <div class="container vh-100">
      <div class="students col-4 d-flex flex-column gap-3 m-auto p-3">
        <h1 class="text-center">Hello my friend</h1>
        <button onclick="openModal()" class="btn btn-secondary">Add Student</button>
        <button onclick="toDashboard()" class="btn btn-secondary">Dashboard</button>
      </div>
    </div>
    

    <div onclick="closeModal()" id="modal" class=" flex-column align-items-center justify-content-center">
      <div onclick="event.stopPropagation()" class="inputs animate__animated animate__backInDown students col-4 d-flex flex-column gap-3 m-auto p-3">
          <input class="form-control  text-center" placeholder="Student Name" type="text" />
          <input class="form-control text-center" placeholder="Age" type="number" />
          <input class="form-control text-center" placeholder="Department" type="text" />
          <input class="form-control text-center" placeholder="Email" type="email" />
          <button onclick="studentDetails(), closeModal()" class="btn btn-secondary">Submit</button>
        </div>
    </div>

    <style>
      #modal{
        width: 100%;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.8);
        position: fixed;
        top: 0;
        display: none;
      }
    </style>


    <script src="js/index.js"></script>
  </body>
</html>
